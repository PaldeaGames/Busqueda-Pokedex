<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscador de Cartas TCG</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#111318;--surface:#1c1f27;--border:rgba(255,255,255,0.07);--text:#f0f0f0;--muted:#6b7280;--found:#22c55e;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;}

header{padding:1rem 1rem 0.6rem;text-align:center;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#0d0f14 0%,var(--bg) 100%);}
header h1{font-family:'Press Start 2P',monospace;font-size:clamp(0.4rem,1.8vw,0.78rem);color:#f5c842;text-shadow:0 0 20px rgba(245,200,66,0.4);letter-spacing:2px;margin-bottom:0.3rem;}
header p{color:var(--muted);font-size:0.65rem;font-weight:700;}

.filters{display:flex;flex-wrap:wrap;gap:0.35rem;justify-content:center;padding:0.55rem 0.6rem 0.45rem;position:sticky;top:0;z-index:100;background:rgba(17,19,24,0.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);}
.filter-btn{display:flex;align-items:center;gap:0.22rem;padding:0.28rem 0.55rem;border-radius:999px;border:2px solid rgba(255,255,255,0.08);font-family:'Nunito',sans-serif;font-weight:900;font-size:0.58rem;cursor:pointer;text-transform:uppercase;transition:all 0.15s;background:rgba(255,255,255,0.04);color:var(--text);}
.filter-btn:hover{transform:translateY(-2px);border-color:var(--clr);}
.filter-btn.active{background:var(--clr);color:#111;border-color:var(--clr);box-shadow:0 0 10px var(--clr);}
.eico{width:13px;height:13px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:0.55rem;background:var(--clr);color:#111;flex-shrink:0;}
.filter-btn.active .eico{background:rgba(0,0,0,0.15);}

.layout{display:flex;max-width:1440px;margin:0 auto;}

/* SIDEBAR */
.sidebar{width:170px;flex-shrink:0;position:sticky;top:72px;height:calc(100vh - 72px);overflow-y:auto;border-right:1px solid var(--border);padding:0.6rem 0.5rem 2rem;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.08) transparent;}
.sidebar::-webkit-scrollbar{width:3px;}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:2px;}
.sb-title{font-family:'Press Start 2P',monospace;font-size:0.34rem;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:0.35rem;padding-bottom:0.28rem;border-bottom:1px solid var(--border);}
.sb-stats{font-size:0.6rem;font-weight:800;margin-bottom:0.42rem;}
.sb-list{display:flex;flex-direction:column;gap:0.08rem;}
.s-item{display:flex;align-items:center;gap:0.25rem;padding:0.18rem 0.28rem;border-radius:5px;cursor:pointer;transition:background 0.12s;background:transparent;border:none;color:var(--text);text-align:left;width:100%;}
.s-item:hover{background:rgba(255,255,255,0.05);}
.s-item.sf{color:var(--found);}
.s-chk{width:10px;height:10px;border-radius:3px;border:1.5px solid var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:0.45rem;flex-shrink:0;color:transparent;transition:all 0.12s;}
.s-item.sf .s-chk{background:var(--found);border-color:var(--found);color:#111;}
.s-nm{font-size:0.58rem;font-weight:700;line-height:1.1;}

.main{flex:1;padding:1rem 0.8rem 5rem;min-width:0;}

/* LISTA ALFABÉTICA */
.alpha-section{margin-bottom:1.8rem;}
.alpha-title{font-family:'Press Start 2P',monospace;font-size:0.48rem;color:#f5c842;margin-bottom:0.65rem;letter-spacing:1px;}
.alpha-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0.22rem 0.45rem;margin-bottom:1.4rem;}
.a-item{display:flex;align-items:center;gap:0.22rem;padding:0.18rem 0.28rem;border-radius:5px;cursor:pointer;background:rgba(255,255,255,0.03);border:1px solid var(--border);font-size:0.6rem;font-weight:700;color:var(--text);transition:background 0.12s;overflow:hidden;}
.a-item:hover{background:rgba(255,255,255,0.07);}
.a-item.af{color:var(--found);border-color:rgba(34,197,94,0.3);background:rgba(34,197,94,0.05);}
.a-chk{width:10px;height:10px;border-radius:3px;border:1.5px solid var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:0.44rem;color:transparent;flex-shrink:0;}
.a-item.af .a-chk{background:var(--found);border-color:var(--found);color:#111;}
.alpha-divider{border:none;border-top:1px solid var(--border);margin:0.8rem 0 1.4rem;}

.type-section{margin-bottom:2rem;animation:fadeUp 0.3s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.sec-header{display:flex;align-items:center;gap:0.5rem;margin-bottom:0.65rem;padding-bottom:0.42rem;border-bottom:2px solid var(--clr);}
.big-ico{width:26px;height:26px;border-radius:50%;background:var(--clr);display:flex;align-items:center;justify-content:center;font-size:0.78rem;flex-shrink:0;box-shadow:0 0 10px var(--clr);}
.sec-header h2{font-family:'Press Start 2P',monospace;font-size:0.5rem;color:var(--clr);letter-spacing:1px;}
.sec-header .sub{font-size:0.52rem;color:var(--muted);font-weight:700;}
.cnt{margin-left:auto;font-family:'Press Start 2P',monospace;font-size:0.38rem;color:var(--muted);background:rgba(255,255,255,0.04);padding:0.16rem 0.32rem;border-radius:5px;}

.poke-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:0.48rem;}

/* CARTA */
.poke-card{background:var(--surface);border-radius:12px;border:1.5px solid var(--border);padding:0.5rem 0.32rem 0.4rem;display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden;transition:transform 0.15s,box-shadow 0.15s,border-color 0.15s;cursor:pointer;}
.poke-card:hover{transform:translateY(-3px);border-color:var(--clr);box-shadow:0 6px 20px -4px var(--clr);}
.poke-card.fc{border-color:var(--found)!important;background:#0a1a0f;}
.poke-card.fc::before{content:'';position:absolute;inset:0;background:rgba(34,197,94,0.05);pointer-events:none;}

.chk-btn{position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--muted);background:rgba(255,255,255,0.04);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0.58rem;transition:all 0.15s;z-index:3;color:transparent;}
.chk-btn:hover{border-color:var(--found);color:var(--found);}
.poke-card.fc .chk-btn{border-color:var(--found);background:var(--found);color:#111;}

/* imagen con toque largo */
.img-wrap{width:64px;height:64px;display:flex;align-items:center;justify-content:center;margin:0 auto 0.3rem;position:relative;user-select:none;-webkit-user-select:none;}
.img-wrap img{width:64px;height:64px;object-fit:contain;transition:transform 0.15s;pointer-events:none;-webkit-user-drag:none;}
.poke-card:hover .img-wrap img{transform:scale(1.08);}
.fallback{width:64px;height:64px;background:rgba(255,255,255,0.05);border-radius:8px;display:none;align-items:center;justify-content:center;font-size:1.5rem;}
.copy-toast{position:absolute;inset:0;background:rgba(34,197,94,0.93);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:0.52rem;font-weight:900;color:#111;text-transform:uppercase;opacity:0;pointer-events:none;transition:opacity 0.15s;}
.img-wrap.copiando .copy-toast{opacity:1;}
.img-wrap.holding img{transform:scale(0.88)!important;}

.poke-name{font-weight:900;font-size:0.58rem;line-height:1.2;margin-bottom:0.22rem;text-align:center;}
.poke-card.fc .poke-name{color:var(--found);}
.poke-tags{display:flex;flex-wrap:wrap;gap:0.1rem;justify-content:center;}
.poke-tag{font-size:0.4rem;font-weight:900;padding:0.07rem 0.22rem;border-radius:4px;text-transform:uppercase;border:1px solid;opacity:0.85;}
.found-bar{position:absolute;bottom:0;left:0;right:0;background:var(--found);color:#111;font-size:0.4rem;font-weight:900;text-transform:uppercase;padding:0.11rem;text-align:center;display:none;}
.poke-card.fc .found-bar{display:block;}

/* ══════════════════════════════════
   POPUP POKÉMON
   ══════════════════════════════════ */
#poke-popup{
  position:fixed;inset:0;z-index:500;
  display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.75);
  backdrop-filter:blur(6px);
  padding:1rem;
}
#poke-popup.open{display:flex;}

.popup-card{
  background:var(--surface);
  border-radius:20px;
  border:1.5px solid var(--border);
  max-width:320px;width:100%;
  padding:1.5rem 1.2rem 1.2rem;
  position:relative;
  display:flex;flex-direction:column;align-items:center;gap:0.8rem;
  animation:popIn 0.2s ease;
}
@keyframes popIn{from{opacity:0;transform:scale(0.9)}to{opacity:1;transform:scale(1)}}

.popup-close{
  position:absolute;top:10px;right:12px;
  background:none;border:none;color:var(--muted);
  font-size:1.2rem;cursor:pointer;line-height:1;
  transition:color 0.12s;
}
.popup-close:hover{color:var(--text);}

.popup-img{
  width:140px;height:140px;object-fit:contain;
  filter:drop-shadow(0 4px 20px rgba(255,255,255,0.1));
}
.popup-img-fallback{
  width:140px;height:140px;
  background:rgba(255,255,255,0.05);border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:3rem;
}

.popup-name{
  font-family:'Press Start 2P',monospace;
  font-size:0.65rem;color:var(--text);
  text-align:center;letter-spacing:1px;
}
.popup-tags{display:flex;flex-wrap:wrap;gap:0.25rem;justify-content:center;}
.popup-tag{font-size:0.55rem;font-weight:900;padding:0.15rem 0.45rem;border-radius:6px;text-transform:uppercase;border:1px solid;opacity:0.9;}

.popup-actions{display:flex;flex-direction:column;gap:0.45rem;width:100%;}

.btn-agregar{
  width:100%;padding:0.55rem;border-radius:10px;border:none;
  background:#ff6b35;color:#fff;
  font-family:'Nunito',sans-serif;font-weight:900;font-size:0.75rem;
  cursor:pointer;transition:opacity 0.15s;
}
.btn-agregar:hover{opacity:0.85;}
.btn-agregar.ya{background:var(--found);pointer-events:none;}

.btn-encontrado{
  width:100%;padding:0.55rem;border-radius:10px;
  border:1.5px solid var(--border);
  background:transparent;color:var(--text);
  font-family:'Nunito',sans-serif;font-weight:900;font-size:0.72rem;
  cursor:pointer;transition:all 0.15s;
}
.btn-encontrado:hover{border-color:var(--found);color:var(--found);}
.btn-encontrado.fc{border-color:var(--found);color:var(--found);background:rgba(34,197,94,0.08);}

.btn-copiar{
  width:100%;padding:0.5rem;border-radius:10px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.04);color:var(--muted);
  font-family:'Nunito',sans-serif;font-weight:900;font-size:0.68rem;
  cursor:pointer;transition:all 0.15s;
}
.btn-copiar:hover{border-color:var(--text);color:var(--text);}
.btn-copiar.copiado{background:var(--found);color:#111;border-color:var(--found);}

/* BOTÓN VOLVER ARRIBA */
#back-top{position:fixed;bottom:1.2rem;right:1rem;width:40px;height:40px;border-radius:50%;background:var(--surface);border:2px solid rgba(255,255,255,0.18);color:var(--text);font-size:1.1rem;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,0.5);transition:all 0.2s;}
#back-top.visible{display:flex;}
#back-top:hover{background:#f5c842;color:#111;border-color:#f5c842;}

/* ÍNDICE A-Z */
#az-bar{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:150;display:none;flex-direction:column;gap:1px;background:rgba(17,19,24,0.92);border-left:1px solid var(--border);border-radius:8px 0 0 8px;padding:3px 2px;}
#az-bar.visible{display:flex;}
.az-btn{width:20px;height:17px;display:flex;align-items:center;justify-content:center;font-size:0.5rem;font-weight:900;color:var(--muted);cursor:pointer;border-radius:3px;transition:all 0.12s;background:transparent;border:none;}
.az-btn.has{color:var(--text);}
.az-btn.has:hover{background:#f5c842;color:#111;}
.az-btn:disabled{opacity:0.2;cursor:default;}

/* FAB MÁS BUSCADOS */
#fab-buscados{position:fixed;bottom:1.2rem;left:1rem;width:44px;height:44px;border-radius:50%;background:#ff6b35;border:none;color:#fff;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:200;box-shadow:0 4px 16px rgba(255,107,53,0.5);transition:all 0.2s;}
#fab-buscados:hover{transform:scale(1.1);}

#panel-buscados{position:fixed;bottom:4.5rem;left:1rem;width:260px;max-height:55vh;background:var(--surface);border:1px solid var(--border);border-radius:14px;z-index:199;display:none;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,0.5);overflow:hidden;}
#panel-buscados.open{display:flex;}

.pb-header{padding:0.65rem 0.75rem 0.45rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:0.4rem;}
.pb-header h3{font-family:'Press Start 2P',monospace;font-size:0.38rem;color:#ff6b35;letter-spacing:1px;flex:1;}
.pb-header span{font-size:0.58rem;color:var(--muted);font-weight:700;}
.pb-list{flex:1;overflow-y:auto;padding:0.35rem 0.45rem;display:flex;flex-direction:column;gap:0.22rem;scrollbar-width:thin;}
.pb-item{display:flex;align-items:center;gap:0.35rem;padding:0.28rem 0.38rem;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:7px;}
.pb-name{flex:1;font-size:0.68rem;font-weight:800;}
.pb-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.72rem;padding:0;line-height:1;transition:color 0.12s;}
.pb-del:hover{color:#ef4444;}
.pb-form{padding:0.4rem 0.45rem 0.5rem;border-top:1px solid var(--border);display:flex;gap:0.3rem;}
.pb-form input{flex:1;padding:0.3rem 0.4rem;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'Nunito',sans-serif;font-size:0.68rem;font-weight:700;outline:none;}
.pb-form input:focus{border-color:#ff6b35;}
.pb-form input::placeholder{color:var(--muted);}
.pb-add{padding:0.3rem 0.5rem;border-radius:6px;border:none;background:#ff6b35;color:#fff;font-family:'Nunito',sans-serif;font-weight:900;font-size:0.62rem;cursor:pointer;white-space:nowrap;}
.pb-empty{color:var(--muted);font-size:0.65rem;font-weight:700;text-align:center;padding:0.8rem 0;}

/* FAB NUEVA BÚSQUEDA */
#fab-nueva{position:fixed;bottom:4rem;right:1rem;width:44px;height:44px;border-radius:50%;background:#7986cb;border:none;color:#fff;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:200;box-shadow:0 4px 16px rgba(121,134,203,0.5);transition:all 0.2s;}
#fab-nueva:hover{transform:scale(1.1);}

#panel-nueva{position:fixed;bottom:9rem;right:1rem;width:300px;background:var(--surface);border:1px solid var(--border);border-radius:14px;z-index:199;display:none;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,0.5);overflow:hidden;}
#panel-nueva.open{display:flex;}

.pn-header{padding:0.65rem 0.75rem 0.45rem;border-bottom:1px solid var(--border);}
.pn-header h3{font-family:'Press Start 2P',monospace;font-size:0.38rem;color:#7986cb;letter-spacing:1px;margin-bottom:0.2rem;}
.pn-header p{font-size:0.6rem;color:var(--muted);font-weight:700;}
.pn-body{padding:0.45rem;}
.pn-body textarea{width:100%;height:120px;padding:0.38rem 0.45rem;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:'Nunito',sans-serif;font-size:0.68rem;font-weight:700;resize:none;outline:none;line-height:1.5;}
.pn-body textarea:focus{border-color:#7986cb;}
.pn-body textarea::placeholder{color:var(--muted);}
.pn-footer{padding:0 0.45rem 0.45rem;display:flex;gap:0.35rem;}
.pn-cancel{flex:1;padding:0.3rem;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'Nunito',sans-serif;font-weight:900;font-size:0.6rem;cursor:pointer;}
.pn-cancel:hover{color:var(--text);border-color:var(--text);}
.pn-load{flex:2;padding:0.3rem;border-radius:7px;border:none;background:#7986cb;color:#fff;font-family:'Nunito',sans-serif;font-weight:900;font-size:0.6rem;cursor:pointer;transition:all 0.15s;}
.pn-load.confirmar{background:#ef4444;animation:pulse 0.4s ease;}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}

.empty{text-align:center;color:var(--muted);padding:3rem;font-size:0.8rem;}

/* RESPONSIVE TABLET */
@media(max-width:768px){
  .sidebar{width:145px;}
  .s-nm{font-size:0.54rem;}
  .alpha-grid{grid-template-columns:repeat(2,1fr);}
  #az-bar .az-btn{width:18px;height:15px;font-size:0.44rem;}
}

/* RESPONSIVE MÓVIL */
@media(max-width:520px){
  .layout{flex-direction:column;}
  .sidebar{width:100%;height:auto;max-height:140px;position:sticky;top:68px;z-index:90;border-right:none;border-bottom:1px solid var(--border);padding:0.45rem 0.6rem 0.5rem;background:rgba(17,19,24,0.97);backdrop-filter:blur(8px);overflow-y:auto;}
  .sb-title{display:inline;margin-right:0.3rem;border-bottom:none;padding-bottom:0;font-size:0.32rem;}
  .sb-stats{display:inline;font-size:0.6rem;}
  .sb-list{flex-direction:row;flex-wrap:wrap;gap:0.2rem;margin-top:0.3rem;}
  .s-item{width:auto;padding:0.12rem 0.38rem;background:rgba(255,255,255,0.04);border-radius:999px;border:1px solid var(--border);}
  .s-item.sf{background:rgba(34,197,94,0.1);border-color:rgba(34,197,94,0.35);}
  .s-chk{display:none;}
  .s-nm{font-size:0.6rem;}
  #az-bar{display:none!important;}
  #back-top{right:0.6rem;bottom:0.8rem;width:36px;height:36px;font-size:1rem;}
  .alpha-grid{grid-template-columns:repeat(2,1fr);}
  .poke-grid{grid-template-columns:repeat(auto-fill,minmax(85px,1fr));}
  .main{padding:0.8rem 0.5rem 5rem;}
  #panel-buscados{width:calc(100vw - 2rem);}
  #panel-nueva{width:calc(100vw - 2rem);right:1rem;}
}
</style>
</head>
<body>

<header>
  <h1>⚡ Buscador de Cartas TCG</h1>
  <p>toca una carta para ver opciones &nbsp;·&nbsp; 📱 mantén imagen = copiar nombre</p>
</header>

<div class="filters" id="filters"></div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sb-title" id="sb-title">Lista</div>
    <div class="sb-stats" id="sb-stats"></div>
    <div class="sb-list" id="sb-list"></div>
  </aside>
  <div class="main" id="main"></div>
</div>

<!-- Volver arriba -->
<button id="back-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<!-- A-Z -->
<div id="az-bar"></div>

<!-- FAB Más buscados -->
<button id="fab-buscados" onclick="togglePanel('buscados')" title="Más buscados">🔥</button>
<div id="panel-buscados">
  <div class="pb-header">
    <h3>🔥 MÁS BUSCADOS</h3>
    <span id="pb-count"></span>
  </div>
  <div class="pb-list" id="pb-list"></div>
  <div class="pb-form">
    <input id="pb-input" type="text" placeholder="Nombre del Pokémon" autocomplete="off">
    <button class="pb-add" onclick="agregarBuscado()">+</button>
  </div>
</div>

<!-- FAB Nueva búsqueda -->
<button id="fab-nueva" onclick="togglePanel('nueva')" title="Nueva búsqueda">📋</button>
<div id="panel-nueva">
  <div class="pn-header">
    <h3>📋 NUEVA BÚSQUEDA</h3>
    <p>Un nombre por línea — se reemplaza la lista actual</p>
  </div>
  <div class="pn-body">
    <textarea id="pn-textarea" placeholder="Alcremie&#10;Lugia&#10;Dragapult&#10;..."></textarea>
  </div>
  <div class="pn-footer">
    <button class="pn-cancel" onclick="cerrarPanels()">Cancelar</button>
    <button class="pn-load" id="pn-load-btn" onclick="cargarNuevaBusqueda()">Cargar listado</button>
  </div>
</div>

<!-- Popup Pokémon -->
<div id="poke-popup" onclick="cerrarPopup(event)">
  <div class="popup-card">
    <button class="popup-close" onclick="cerrarPopup()">✕</button>
    <img class="popup-img" id="popup-img" src="" alt="">
    <div class="popup-img-fallback" id="popup-fallback" style="display:none">🔍</div>

// ══════════════════════════════════════
// PARSEAR NUEVA LISTA
// ══════════════════════════════════════
const POKEDATA=buildDefaultLista().reduce((m,p)=>{m[p.name.toLowerCase()]=p;return m;},{});

function parsearListado(texto){
  return texto.split('\n').map(l=>l.trim()).filter(l=>l.length>0).map(nombre=>{
    const key=nombre.toLowerCase();
    let data=POKEDATA[key];
    if(!data){const match=Object.keys(POKEDATA).find(k=>k.includes(key)||key.includes(k));if(match)data=POKEDATA[match];}
    if(data)return{...data,name:nombre};
    return{name:nombre,pokeId:null,energias:["incoloro"],tags:["?"]};
  });
}

let confirmandoCarga=false;let confirmTimer=null;
function cargarNuevaBusqueda(){
  const btn=document.getElementById('pn-load-btn');
  const texto=document.getElementById('pn-textarea').value.trim();
  if(!texto){alert('Pegá al menos un nombre');return;}
  if(!confirmandoCarga){
    confirmandoCarga=true;
    btn.textContent='⚠️ ¿Confirmar? (toca de nuevo)';
    btn.classList.add('confirmar');
    confirmTimer=setTimeout(()=>{confirmandoCarga=false;btn.textContent='Cargar listado';btn.classList.remove('confirmar');},3000);
    return;
  }
  clearTimeout(confirmTimer);confirmandoCarga=false;
  btn.textContent='Cargar listado';btn.classList.remove('confirmar');
  found=new Set();saveFound();
  listaActual=parsearListado(texto);saveLista();
  cerrarPanels();
  document.getElementById('pn-textarea').value='';
  current='todos';render();
}

// ══════════════════════════════════════
// MÁS BUSCADOS
// ══════════════════════════════════════
function agregarBuscado(nombre){
  const n=nombre||(document.getElementById('pb-input').value.trim());
  if(!n)return;
  if(!buscados.includes(n)){buscados.push(n);saveBuscados();}
  document.getElementById('pb-input').value='';
  renderBuscados();
}
function eliminarBuscado(i){buscados.splice(i,1);saveBuscados();renderBuscados();}
function renderBuscados(){
  const list=document.getElementById('pb-list');
  const count=document.getElementById('pb-count');
  count.textContent=buscados.length?`${buscados.length} items`:'';
  list.innerHTML=buscados.length
    ?buscados.map((b,i)=>`<div class="pb-item"><span class="pb-name">${b}</span><button class="pb-del" onclick="eliminarBuscado(${i})">✕</button></div>`).join('')
    :'<div class="pb-empty">Sin registros aún</div>';
}
document.getElementById('pb-input').addEventListener('keydown',e=>{if(e.key==='Enter')agregarBuscado();});

// PANELES
// ══════════════════════════════════════
function togglePanel(which){
  const pb=document.getElementById('panel-buscados');
  const pn=document.getElementById('panel-nueva');
  if(which==='buscados'){pb.classList.toggle('open');pn.classList.remove('open');if(pb.classList.contains('open'))renderBuscados();}
  else{pn.classList.toggle('open');pb.classList.remove('open');confirmandoCarga=false;document.getElementById('pn-load-btn').textContent='Cargar listado';document.getElementById('pn-load-btn').classList.remove('confirmar');}
}
function cerrarPanels(){
  document.getElementById('panel-buscados').classList.remove('open');
  document.getElementById('panel-nueva').classList.remove('open');
}
document.addEventListener('click',e=>{
  const pb=document.getElementById('panel-buscados');const pn=document.getElementById('panel-nueva');
  const fb=document.getElementById('fab-buscados');const fn=document.getElementById('fab-nueva');
  if(!pb.contains(e.target)&&e.target!==fb)pb.classList.remove('open');
  if(!pn.contains(e.target)&&e.target!==fn)pn.classList.remove('open');
});

// ══════════════════════════════════════
// POPUP POKÉMON
// ══════════════════════════════════════
let popupPoke=null;

function abrirPopup(p){
  popupPoke=p;
  const popup=document.getElementById('poke-popup');
  const img=document.getElementById('popup-img');
  const fallback=document.getElementById('popup-fallback');
  const name=document.getElementById('popup-name');
  const tags=document.getElementById('popup-tags');
  const btnAgregar=document.getElementById('popup-btn-agregar');
  const btnEncontrado=document.getElementById('popup-btn-encontrado');

  // Imagen
  if(p.pokeId){
    img.src=`https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/other/official-artwork/${p.pokeId}.png`;
    img.onerror=function(){
      this.src=`https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/${p.pokeId}.png`;
      this.onerror=function(){this.style.display='none';fallback.style.display='flex';};
    };
    img.style.display='block';fallback.style.display='none';
  } else {
    img.style.display='none';fallback.style.display='flex';
  }

  name.textContent=p.name;
  tags.innerHTML=p.tags.map(t=>`<span class="popup-tag" style="color:${tagColor(t)};border-color:${tagColor(t)}55">${t}</span>`).join('');

  // Estado más buscados
  const yaEnBuscados=buscados.includes(p.name);
  btnAgregar.textContent=yaEnBuscados?'✓ Ya está en Más Buscados':'🔥 Agregar a Más Buscados';
  btnAgregar.className='btn-agregar'+(yaEnBuscados?' ya':'');

  // Estado encontrado
  actualizarBtnEncontrado();

  popup.classList.add('open');
  document.body.style.overflow='hidden';
}

function actualizarBtnEncontrado(){
  const btn=document.getElementById('popup-btn-encontrado');
  const fc=popupPoke&&found.has(popupPoke.name);
  btn.textContent=fc?'✓ Encontrado — desmarcar':'✓ Marcar como encontrado';
  btn.className='btn-encontrado'+(fc?' fc':'');
}

function cerrarPopup(e){
  if(e&&e.target!==document.getElementById('poke-popup'))return;
  document.getElementById('poke-popup').classList.remove('open');
  document.body.style.overflow='';
  popupPoke=null;
}

function agregarDesdePopup(){
  if(!popupPoke)return;
  agregarBuscado(popupPoke.name);
  const btn=document.getElementById('popup-btn-agregar');
  btn.textContent='✓ Agregado!';btn.className='btn-agregar ya';
}

function toggleFoundDesdePopup(){
  if(!popupPoke)return;
  toggleFound(popupPoke.name);
  actualizarBtnEncontrado();
}

function copiarDesdePopup(){
  if(!popupPoke)return;
  const btn=document.getElementById('popup-btn-copiar');
  const doToast=()=>{btn.textContent='✓ Copiado!';btn.className='btn-copiar copiado';setTimeout(()=>{btn.textContent='📋 Copiar nombre';btn.className='btn-copiar';},2000);};
  const fallback=()=>{const el=document.createElement('input');el.value=popupPoke.name;el.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px;';document.body.appendChild(el);el.focus();el.select();el.setSelectionRange(0,9999);try{document.execCommand('copy');doToast();}catch(e){}document.body.removeChild(el);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(popupPoke.name).then(doToast).catch(fallback);}
  else{fallback();}
}

// ══════════════════════════════════════
// TOQUE LARGO 400ms
// ══════════════════════════════════════
let holdTimer=null;let holdFired=false;

function setupHold(wrap,name){
  wrap.addEventListener('touchstart',e=>{
    holdFired=false;
    wrap.classList.add('holding');
    holdTimer=setTimeout(()=>{
      holdFired=true;
      wrap.classList.remove('holding');
      copiarTexto(wrap,name);
    },400);
  },{passive:true});
  const cancel=()=>{wrap.classList.remove('holding');clearTimeout(holdTimer);};
  wrap.addEventListener('touchend',cancel);
  wrap.addEventListener('touchmove',cancel);
  wrap.addEventListener('touchcancel',cancel);
}

function copiarTexto(wrap,name){
  const doToast=()=>{wrap.classList.add('copiando');setTimeout(()=>wrap.classList.remove('copiando'),1500);};
  const fallback=()=>{const el=document.createElement('input');el.value=name;el.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px;';document.body.appendChild(el);el.focus();el.select();el.setSelectionRange(0,9999);try{document.execCommand('copy');doToast();}catch(e){}document.body.removeChild(el);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(name).then(doToast).catch(fallback);}
  else{fallback();}
}

const TYPE_E={"Fuego":"fuego","Agua":"agua","Hielo":"agua","Eléctrico":"rayo","Planta":"planta","Bicho":"planta","Lucha":"lucha","Roca":"lucha","Tierra":"lucha","Psíquico":"psiquico","Fantasma":"psiquico","Veneno":"psiquico","Oscuro":"oscuro","Acero":"metal","Dragón":"dragon","Normal":"incoloro","Volador":"incoloro","Hada":"hada","?":"incoloro"};
function tagColor(tag){const eid=TYPE_E[tag]||"incoloro";return(ENERGIAS.find(e=>e.id===eid)||{color:"#888"}).color;}
function eColor(id){return(ENERGIAS.find(e=>e.id===id)||{color:"#888"}).color;}
function sid(name){return'card-'+name.replace(/[^a-z0-9]/gi,'_');}
function sprite(id){return id?`https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/other/official-artwork/${id}.png`:null;}
function spriteFb(id){return id?`https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/${id}.png`:null;}

// ══════════════════════════════════════
// RENDER
// ══════════════════════════════════════
let current="todos";
function getAlpha(){return[...listaActual].sort((a,b)=>a.name.localeCompare(b.name));}

function cardHTML(p,clr){
  const fc=found.has(p.name);
  const tags=p.tags.map(t=>`<span class="poke-tag" style="color:${tagColor(t)};border-color:${tagColor(t)}55">${t}</span>`).join('');
  const imgSrc=sprite(p.pokeId);const imgFb=spriteFb(p.pokeId);
  const imgTag=imgSrc?`<img src="${imgSrc}" alt="${p.name}" loading="lazy" onerror="this.src='${imgFb}';this.onerror=function(){this.style.display='none';this.nextElementSibling.style.display='flex';}">`:'' ;
  const sn=p.name.replace(/'/g,"\\'");
  return`<div class="poke-card${fc?' fc':''}" style="--clr:${clr}" id="${sid(p.name)}" onclick="abrirPopup(listaActual.find(x=>x.name==='${sn}'))">
    <button class="chk-btn" onclick="event.stopPropagation();toggleFound('${sn}')">✓</button>
    <div class="img-wrap" data-name="${p.name.replace(/"/g,'&quot;')}">
      ${imgTag}<div class="fallback">${imgSrc?'❓':'🔍'}</div>
      <div class="copy-toast">✓ Copiado!</div>
    </div>
    <div class="poke-name">${p.name}</div>
    <div class="poke-tags">${tags}</div>
    <div class="found-bar">✓ Encontrado</div>
  </div>`;
}

function sectionHTML(e){
  const lista=listaActual.filter(p=>p.energias.includes(e.id));
  if(!lista.length)return'';
  return`<div class="type-section" style="--clr:${e.color}">
    <div class="sec-header" style="--clr:${e.color};border-color:${e.color}">
      <div class="big-ico" style="background:${e.color}">${e.icon}</div>
      <div><h2 style="color:${e.color}">ENERGÍA ${e.label.toUpperCase()}</h2>${e.nota?`<div class="sub">${e.nota}</div>`:''}</div>
      <div class="cnt">${lista.length} pokémon</div>
    </div>
    <div class="poke-grid">${lista.map(p=>cardHTML(p,e.color)).join('')}</div>
  </div>`;
}

function attachHoldEvents(){
  document.querySelectorAll('.img-wrap[data-name]').forEach(wrap=>{setupHold(wrap,wrap.dataset.name);});
}

function renderMain(){
  const el=document.getElementById('main');
  const azBar=document.getElementById('az-bar');
  const alpha=getAlpha();
  if(current==='todos'){
    azBar.classList.add('visible');
    const totalF=alpha.filter(p=>found.has(p.name)).length;
    const items=alpha.map(p=>`<div class="a-item${found.has(p.name)?' af':''}" onclick="jumpTo('${sid(p.name)}')"><span class="a-chk">✓</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.name}</span></div>`).join('');
    const sections=ENERGIAS.filter(e=>e.id!=='todos').map(sectionHTML).join('');
    el.innerHTML=`<div class="alpha-section"><div class="alpha-title">★ Lista actual — ${totalF}/${alpha.length} encontrados</div><div class="alpha-grid">${items}</div><hr class="alpha-divider"></div>${sections}`;
    buildAZBar(alpha);
  } else {
    azBar.classList.remove('visible');
    const e=ENERGIAS.find(x=>x.id===current);
    el.innerHTML=sectionHTML(e)||`<div class="empty">Sin Pokémon en esta energía</div>`;
  }
  attachHoldEvents();
}

function buildAZBar(alpha){
  const tiene=new Set(alpha.map(p=>p.name[0].toUpperCase()));
  document.getElementById('az-bar').innerHTML='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(l=>`<button class="az-btn${tiene.has(l)?' has':''}" ${tiene.has(l)?`onclick="jumpToLetter('${l}')"`:' disabled'}>${l}</button>`).join('');
}
function jumpToLetter(l){const first=getAlpha().find(p=>p.name[0].toUpperCase()===l);if(first)jumpTo(sid(first.name));}
function jumpTo(id){const el=document.getElementById(id);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.outline='2px solid #f5c842';setTimeout(()=>el.style.outline='',1200);}}

function renderSidebar(){
  const alpha=getAlpha();
  const lista=current==='todos'?alpha:alpha.filter(p=>p.energias.includes(current));
  const totalF=lista.filter(p=>found.has(p.name)).length;
  const clr=current==='todos'?'#f5c842':eColor(current);
  document.getElementById('sb-title').textContent=current==='todos'?'Lista actual':`Energía ${ENERGIAS.find(e=>e.id===current)?.label||''}`;
  document.getElementById('sb-stats').innerHTML=`<span style="color:${clr}">${totalF}</span><span style="color:var(--muted)"> / ${lista.length}</span>`;
  document.getElementById('sb-list').innerHTML=lista.map(p=>`<button class="s-item${found.has(p.name)?' sf':''}" onclick="jumpTo('${sid(p.name)}')"><span class="s-chk">✓</span><span class="s-nm">${p.name}</span></button>`).join('');
}

function renderFilters(){
  document.getElementById('filters').innerHTML=ENERGIAS.map(e=>`<button class="filter-btn${current===e.id?' active':''}" style="--clr:${e.color}" onclick="setFilter('${e.id}')"><span class="eico">${e.icon}</span>${e.label}</button>`).join('');
}

function setFilter(id){current=id;render();window.scrollTo({top:0,behavior:'smooth'});}
function render(){renderFilters();renderSidebar();renderMain();}

window.addEventListener('scroll',()=>{document.getElementById('back-top').classList.toggle('visible',window.scrollY>300);});

render();
</script>
</body>
</html>
