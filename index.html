<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscador de Cartas TCG</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#111318; --surface:#1c1f27; --border:rgba(255,255,255,0.07);
  --text:#f0f0f0; --muted:#6b7280; --found:#22c55e;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:'Nunito',sans-serif; min-height:100vh; }

header {
  padding:1.2rem 1rem 0.8rem; text-align:center;
  border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,#0d0f14 0%,var(--bg) 100%);
}
header h1 {
  font-family:'Press Start 2P',monospace;
  font-size:clamp(0.45rem,1.8vw,0.8rem);
  color:#f5c842; text-shadow:0 0 20px rgba(245,200,66,0.4);
  letter-spacing:2px; margin-bottom:0.3rem;
}
header p { color:var(--muted); font-size:0.72rem; font-weight:700; }

/* FILTROS */
.filters {
  display:flex; flex-wrap:wrap; gap:0.4rem; justify-content:center;
  padding:0.65rem 0.8rem 0.55rem;
  position:sticky; top:0; z-index:100;
  background:rgba(17,19,24,0.97); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
.filter-btn {
  display:flex; align-items:center; gap:0.28rem;
  padding:0.32rem 0.62rem; border-radius:999px;
  border:2px solid rgba(255,255,255,0.08);
  font-family:'Nunito',sans-serif; font-weight:900; font-size:0.63rem;
  cursor:pointer; text-transform:uppercase; letter-spacing:0.3px;
  transition:all 0.15s; background:rgba(255,255,255,0.04); color:var(--text);
}
.filter-btn:hover { transform:translateY(-2px); border-color:var(--clr); }
.filter-btn.active { background:var(--clr); color:#111; border-color:var(--clr); box-shadow:0 0 10px var(--clr); }
.eico {
  width:15px; height:15px; border-radius:50%;
  display:inline-flex; align-items:center; justify-content:center;
  font-size:0.6rem; background:var(--clr); color:#111; flex-shrink:0;
}
.filter-btn.active .eico { background:rgba(0,0,0,0.15); }

/* LAYOUT */
.layout { display:flex; max-width:1440px; margin:0 auto; }

/* SIDEBAR */
.sidebar {
  width:185px; flex-shrink:0;
  position:sticky; top:82px;
  height:calc(100vh - 82px);
  overflow-y:auto;
  border-right:1px solid var(--border);
  padding:0.75rem 0.55rem 2rem;
  scrollbar-width:thin; scrollbar-color:rgba(255,255,255,0.1) transparent;
}
.sidebar::-webkit-scrollbar { width:3px; }
.sidebar::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.1); border-radius:2px; }

.sidebar-title {
  font-family:'Press Start 2P',monospace; font-size:0.38rem;
  color:var(--muted); letter-spacing:1px; text-transform:uppercase;
  margin-bottom:0.45rem; padding-bottom:0.35rem; border-bottom:1px solid var(--border);
}
.sidebar-stats {
  font-size:0.64rem; font-weight:800; margin-bottom:0.55rem;
}
.sidebar-list { display:flex; flex-direction:column; gap:0.12rem; }

.s-item {
  display:flex; align-items:center; gap:0.3rem;
  padding:0.22rem 0.35rem; border-radius:6px;
  cursor:pointer; transition:background 0.12s;
  background:transparent; border:none; color:var(--text);
  text-align:left; width:100%;
}
.s-item:hover { background:rgba(255,255,255,0.05); }
.s-item.s-found { color:var(--found); }
.s-check {
  width:12px; height:12px; border-radius:3px;
  border:1.5px solid var(--muted);
  display:inline-flex; align-items:center; justify-content:center;
  font-size:0.5rem; flex-shrink:0; transition:all 0.12s; color:transparent;
}
.s-item.s-found .s-check { background:var(--found); border-color:var(--found); color:#111; }
.s-name { font-size:0.62rem; font-weight:700; line-height:1.1; }

/* MAIN */
.main { flex:1; padding:1.1rem 0.9rem 4rem; min-width:0; }

/* SECCIÓN TODOS — lista alfabética en 3 columnas */
.all-alpha {
  margin-bottom:2rem;
}
.all-alpha-title {
  font-family:'Press Start 2P',monospace; font-size:0.52rem;
  color:#f5c842; margin-bottom:0.8rem; letter-spacing:1px;
}
.all-alpha-grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:0.3rem 0.6rem;
  margin-bottom:2rem;
}
.alpha-item {
  display:flex; align-items:center; gap:0.3rem;
  padding:0.22rem 0.35rem; border-radius:6px;
  cursor:pointer; background:rgba(255,255,255,0.03);
  border:1px solid var(--border);
  font-size:0.65rem; font-weight:700; color:var(--text);
  transition:background 0.12s;
}
.alpha-item:hover { background:rgba(255,255,255,0.07); }
.alpha-item.af { color:var(--found); border-color:rgba(34,197,94,0.3); background:rgba(34,197,94,0.05); }
.alpha-check {
  width:12px; height:12px; border-radius:3px; border:1.5px solid var(--muted);
  display:inline-flex; align-items:center; justify-content:center;
  font-size:0.5rem; color:transparent; flex-shrink:0; transition:all 0.12s;
}
.alpha-item.af .alpha-check { background:var(--found); border-color:var(--found); color:#111; }
.alpha-divider { border:none; border-top:1px solid var(--border); margin:1.2rem 0; }

/* SECCIONES POR TIPO */
.type-section { margin-bottom:2.2rem; animation:fadeUp 0.3s ease both; }
@keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

.section-header {
  display:flex; align-items:center; gap:0.6rem;
  margin-bottom:0.75rem; padding-bottom:0.5rem; border-bottom:2px solid var(--clr);
}
.big-icon {
  width:28px; height:28px; border-radius:50%; background:var(--clr);
  display:flex; align-items:center; justify-content:center;
  font-size:0.85rem; flex-shrink:0; box-shadow:0 0 10px var(--clr);
}
.section-header h2 { font-family:'Press Start 2P',monospace; font-size:0.54rem; color:var(--clr); letter-spacing:1px; }
.section-header .sub { font-size:0.55rem; color:var(--muted); font-weight:700; }
.count { margin-left:auto; font-family:'Press Start 2P',monospace; font-size:0.42rem; color:var(--muted); background:rgba(255,255,255,0.04); padding:0.18rem 0.38rem; border-radius:5px; }

/* GRID CARTAS */
.pokemon-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(108px,1fr)); gap:0.55rem; }

.poke-card {
  background:var(--surface); border-radius:13px; border:1.5px solid var(--border);
  padding:0.55rem 0.35rem 0.45rem;
  display:flex; flex-direction:column; align-items:center;
  position:relative; overflow:hidden;
  transition:transform 0.15s,box-shadow 0.15s,border-color 0.15s;
}
.poke-card.fc { border-color:var(--found) !important; background:#0a1a0f; }
.poke-card.fc::before { content:''; position:absolute; inset:0; background:rgba(34,197,94,0.05); pointer-events:none; }

/* botón check */
.chk-btn {
  position:absolute; top:5px; right:5px;
  width:20px; height:20px; border-radius:50%;
  border:1.5px solid var(--muted);
  background:rgba(255,255,255,0.04);
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  font-size:0.65rem; transition:all 0.15s; z-index:3; color:transparent;
}
.chk-btn:hover { border-color:var(--found); color:var(--found); background:rgba(34,197,94,0.12); }
.poke-card.fc .chk-btn { border-color:var(--found); background:var(--found); color:#111; }

/* link imagen+nombre */
.poke-link {
  display:flex; flex-direction:column; align-items:center;
  text-decoration:none; color:inherit; width:100%;
}
.poke-img-wrap { width:68px; height:68px; display:flex; align-items:center; justify-content:center; margin:0 auto 0.35rem; }
.poke-img-wrap img { width:68px; height:68px; object-fit:contain; transition:transform 0.15s; }
.poke-link:hover .poke-img-wrap img { transform:scale(1.1); }
.fallback { width:68px; height:68px; background:rgba(255,255,255,0.05); border-radius:9px; display:none; align-items:center; justify-content:center; font-size:1.7rem; }

.poke-name { font-weight:900; font-size:0.63rem; line-height:1.2; margin-bottom:0.28rem; }
.poke-card.fc .poke-name { color:var(--found); }

.poke-tags { display:flex; flex-wrap:wrap; gap:0.12rem; justify-content:center; }
.poke-tag { font-size:0.44rem; font-weight:900; padding:0.08rem 0.26rem; border-radius:4px; text-transform:uppercase; border:1px solid; opacity:0.85; }

.found-bar { position:absolute; bottom:0; left:0; right:0; background:var(--found); color:#111; font-size:0.44rem; font-weight:900; text-transform:uppercase; letter-spacing:0.3px; padding:0.14rem; text-align:center; display:none; }
.poke-card.fc .found-bar { display:block; }

.empty { text-align:center; color:var(--muted); padding:3rem; font-size:0.8rem; }

@media(max-width:640px){
  .sidebar { width:150px; }
  .s-name { font-size:0.56rem; }
}
@media(max-width:500px){
  .layout { flex-direction:column; }
  .sidebar { width:100%; height:auto; position:static; border-right:none; border-bottom:1px solid var(--border); max-height:140px; padding:0.5rem; }
  .sidebar-list { flex-direction:row; flex-wrap:wrap; gap:0.2rem; }
  .s-item { width:auto; padding:0.18rem 0.4rem; }
  .s-check { display:none; }
  .all-alpha-grid { grid-template-columns:repeat(2,1fr); }
}
</style>
</head>
<body>

<header>
  <h1>⚡ Buscador de Cartas TCG</h1>
  <p>✓ para marcar encontrado &nbsp;·&nbsp; tocá la imagen para buscar en PokémonTCG.io</p>
</header>

<div class="filters" id="filters"></div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-title" id="sb-title">Lista</div>
    <div class="sidebar-stats" id="sb-stats"></div>
    <div class="sidebar-list" id="sb-list"></div>
  </aside>
  <div class="main" id="main"></div>
</div>

<script>
// ═══════════════════════════════════════════════
// STORAGE
// ═══════════════════════════════════════════════
const SK = 'tcg_found_v1';
let found = new Set();
try { const s = localStorage.getItem(SK); if(s) found = new Set(JSON.parse(s)); } catch(e){}
function saveFound(){ try{ localStorage.setItem(SK,JSON.stringify([...found])); }catch(e){} }
function toggleFound(name){
  if(found.has(name)) found.delete(name); else found.add(name);
  saveFound(); render();
}

// ═══════════════════════════════════════════════
// DATOS
// ═══════════════════════════════════════════════

const POKEMON = [

  { name:"Type: Null",  pokeId:772, energias:["incoloro"],            tags:["Normal"] },
  { name:"Venusaur",    pokeId:3,   energias:["planta"],              tags:["Planta","Veneno"] },
  { name:"Whiscash",    pokeId:340, energias:["agua","lucha"],        tags:["Agua","Tierra"] },
  { name:"Wishiwashi",  pokeId:746, energias:["agua"],                tags:["Agua"] },
  { name:"Wyrdeer",     pokeId:899, energias:["incoloro","psiquico"], tags:["Normal","Psíquico"] },
  { name:"Xurkitree",   pokeId:796, energias:["rayo"],                tags:["Eléctrico"] },
  { name:"Zygarde",     pokeId:718, energias:["dragon","lucha"],      tags:["Dragón","Tierra"] },

// ordenados alfabéticamente (lista maestra única)
const ALPHA = [...POKEMON].sort((a,b)=>a.name.localeCompare(b.name));

// ═══════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════
function sprite(id){ return `https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/other/official-artwork/${id}.png`; }
function spriteFb(id){ return `https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/${id}.png`; }
function tcgUrl(name){ return `https://www.pokemontcg.io/cards?q=${encodeURIComponent(name)}`; }

const TYPE_ENERGY = {
  "Fuego":"fuego","Agua":"agua","Hielo":"agua","Eléctrico":"rayo",
  "Planta":"planta","Bicho":"planta",
  "Lucha":"lucha","Roca":"lucha","Tierra":"lucha",
  "Psíquico":"psiquico","Fantasma":"psiquico","Veneno":"psiquico",
  "Oscuro":"oscuro","Acero":"metal","Dragón":"dragon",
  "Normal":"incoloro","Volador":"incoloro","Hada":"hada",
};
function tagColor(tag){
  const eid = TYPE_ENERGY[tag]||"incoloro";
  return (ENERGIAS.find(e=>e.id===eid)||{color:"#888"}).color;
}
function energiaColor(id){ return (ENERGIAS.find(e=>e.id===id)||{color:"#888"}).color; }

// ═══════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════
let current = "todos";

function cardHTML(p, clr){
  const fc = found.has(p.name);
  const tags = p.tags.map(t=>`<span class="poke-tag" style="color:${tagColor(t)};border-color:${tagColor(t)}55">${t}</span>`).join('');
  return `
    <div class="poke-card${fc?' fc':''}" style="--clr:${clr}" id="card-${p.name.replace(/[^a-z0-9]/gi,'_')}">
      <button class="chk-btn" onclick="event.preventDefault();toggleFound('${p.name.replace(/'/g,"\\'")}')">✓</button>
      <a class="poke-link" href="${tcgUrl(p.name)}" target="_blank" rel="noopener">
        <div class="poke-img-wrap">
          <img src="${sprite(p.pokeId)}" alt="${p.name}" loading="lazy"
               onerror="this.src='${spriteFb(p.pokeId)}';this.onerror=function(){this.style.display='none';this.nextElementSibling.style.display='flex';}">
          <div class="fallback">❓</div>
        </div>
        <div class="poke-name">${p.name}</div>
        <div class="poke-tags">${tags}</div>
      </a>
      <div class="found-bar">✓ Encontrado</div>
    </div>`;
}

function sectionHTML(e){
  const lista = POKEMON.filter(p=>p.energias.includes(e.id));
  if(!lista.length) return '';
  return `
    <div class="type-section" style="--clr:${e.color}">
      <div class="section-header" style="--clr:${e.color};border-color:${e.color}">
        <div class="big-icon" style="background:${e.color}">${e.icon}</div>
        <div>
          <h2 style="color:${e.color}">ENERGÍA ${e.label.toUpperCase()}</h2>
          ${e.nota?`<div class="sub">${e.nota}</div>`:''}
        </div>
        <div class="count">${lista.length} pokémon</div>
      </div>
      <div class="pokemon-grid">${lista.map(p=>cardHTML(p,e.color)).join('')}</div>
    </div>`;
}

function renderMain(){
  const el = document.getElementById('main');
  if(current==='todos'){
    // Vista TODOS: lista alfabética en 3 columnas + todas las secciones por tipo
    const totalFound = ALPHA.filter(p=>found.has(p.name)).length;
    const alphaItems = ALPHA.map(p=>{
      const fc = found.has(p.name);
      return `<div class="alpha-item${fc?' af':''}" onclick="scrollToCard('${p.name.replace(/'/g,"\\'")}')">
        <span class="alpha-check">✓</span>
        <span style="font-size:0.63rem;font-weight:700">${p.name}</span>
      </div>`;
    }).join('');

    const sections = ENERGIAS.filter(e=>e.id!=='todos').map(sectionHTML).join('');

    el.innerHTML = `
      <div class="all-alpha">
        <div class="all-alpha-title">★ Lista completa — ${totalFound}/${ALPHA.length} encontrados</div>
        <div class="all-alpha-grid">${alphaItems}</div>
        <hr class="alpha-divider">
      </div>
      ${sections}`;
  } else {
    const e = ENERGIAS.find(x=>x.id===current);
    const html = sectionHTML(e);
    el.innerHTML = html || `<div class="empty">Sin Pokémon en esta energía</div>`;
  }
}

function renderSidebar(){
  // Lista de pokémon visibles según filtro activo, orden alfabético
  const lista = current==='todos'
    ? ALPHA
    : ALPHA.filter(p=>p.energias.includes(current));

  const totalFound = lista.filter(p=>found.has(p.name)).length;
  const clr = current==='todos' ? '#f5c842' : energiaColor(current);

  document.getElementById('sb-title').textContent = current==='todos' ? 'Lista completa' : `Energía ${ENERGIAS.find(e=>e.id===current)?.label||''}`;
  document.getElementById('sb-stats').innerHTML =
    `<span style="color:${clr}">${totalFound}</span><span style="color:var(--muted)"> / ${lista.length} encontrados</span>`;

  document.getElementById('sb-list').innerHTML = lista.map(p=>{
    const fc = found.has(p.name);
    return `<button class="s-item${fc?' s-found':''}" onclick="scrollToCard('${p.name.replace(/'/g,"\\'")}')">
      <span class="s-check">✓</span>
      <span class="s-name">${p.name}</span>
    </button>`;
  }).join('');
}

function renderFilters(){
  document.getElementById('filters').innerHTML = ENERGIAS.map(e=>`
    <button class="filter-btn${current===e.id?' active':''}" style="--clr:${e.color}"
            onclick="setFilter('${e.id}')">
      <span class="eico">${e.icon}</span>${e.label}
    </button>`).join('');
}

function scrollToCard(name){
  const id = 'card-'+name.replace(/[^a-z0-9]/gi,'_');
  const el = document.getElementById(id);
  if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.style.outline='2px solid var(--found)'; setTimeout(()=>el.style.outline='',1200); }
}

function setFilter(id){
  current=id; render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function render(){
  renderFilters();
  renderSidebar();
  renderMain();
}

render();
</script>
</body>
</html>
